appId: 'com.celestys.launcher'
productName: 'Celestys Launcher'

artifactName: '${productName}-setup-${version}.${ext}'
copyright: 'Copyright ©2026 Celestys'

asar: true
compression: 'maximum'

files:
  - "**/*"
  - "!dist/**/*"
  - "!docs/**/*"
  - "!dev-app-update.yml"

extraResources:
  - 'libraries'

win:
  icon: 'build/icon.svg'
  target: 
    - target: 'nsis'
      arch: 'x64'
    - target: 'zip'
      arch: 'x64'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 'Celestys Launcher'

mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
    - target: 'zip'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

linux:
  icon: 'build/icon.svg'
  target:
    - target: 'AppImage'
      arch: 'x64'
    - target: 'deb'
      arch: 'x64'
  maintainer: 'XKaienX'
  vendor: 'Celestys'
  synopsis: 'Launcher Oficial do Servidor Celestys'
  description: 'Launcher oficial da Celestys para All The Mons, com instalação e atualizações automáticas.'
  category: 'Game'

publish:
  provider: 'github'
  owner: 'XKaienX'
  repo: 'CelestysLauncher'
  releaseType: 'release'

directories:
  buildResources: 'build'
  output: 'dist'







