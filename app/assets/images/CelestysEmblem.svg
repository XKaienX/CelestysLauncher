<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#02010a"/>
      <stop offset=".48" stop-color="#12032f"/>
      <stop offset=".78" stop-color="#3b0879"/>
      <stop offset="1" stop-color="#7c22ff" stop-opacity=".2"/>
    </radialGradient>
    <linearGradient id="whiteRing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".45" stop-color="#f7efff"/>
      <stop offset="1" stop-color="#b996ff"/>
    </linearGradient>
    <linearGradient id="redRing" x1="0" y1=".5" x2="1" y2=".5">
      <stop stop-color="#ff214f"/>
      <stop offset=".45" stop-color="#ff3a19"/>
      <stop offset="1" stop-color="#ff1744"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2b8ff"/>
      <stop offset=".35" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="194" fill="url(#space)" stroke="#8b5cf6" stroke-width="5" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="162" fill="#02010a" opacity=".78"/>

  <!-- galaxy specks -->
  <g fill="#fff" opacity=".85">
    <circle cx="176" cy="126" r="2"/><circle cx="336" cy="130" r="2.4"/><circle cx="386" cy="207" r="1.8"/>
    <circle cx="131" cy="218" r="1.6"/><circle cx="365" cy="333" r="1.6"/><circle cx="176" cy="365" r="2"/>
    <circle cx="245" cy="106" r="1.3"/><circle cx="298" cy="385" r="1.2"/><circle cx="104" cy="286" r="1.2"/>
  </g>

  <!-- orbital rings -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="214" ry="92" transform="rotate(-10 256 256)" stroke="url(#whiteRing)" stroke-width="25" filter="url(#softGlow)"/>
    <ellipse cx="256" cy="256" rx="188" ry="67" transform="rotate(8 256 256)" stroke="url(#redRing)" stroke-width="13" filter="url(#softGlow)"/>
    <ellipse cx="256" cy="256" rx="218" ry="96" transform="rotate(16 256 256)" stroke="#9b4dff" stroke-width="4" opacity=".65"/>
  </g>

  <!-- black-hole core -->
  <ellipse cx="256" cy="256" rx="124" ry="74" fill="#020108"/>
  <ellipse cx="256" cy="256" rx="98" ry="56" fill="#080018"/>
  <path d="M174 267c39-42 114-58 169-19-33-9-64-7-89 7-25 13-40 35-39 59-19-11-34-26-41-47z" fill="#31005d" opacity=".72"/>

  <!-- eyes / celestial stars -->
  <g fill="url(#violet)" stroke="#fff" stroke-width="4" filter="url(#glow)">
    <path d="M202 214l10 27 27 10-27 10-10 27-10-27-27-10 27-10z"/>
    <path d="M310 214l10 27 27 10-27 10-10 27-10-27-27-10 27-10z"/>
  </g>

  <!-- outer stars -->
  <g fill="url(#violet)" stroke="#fff" stroke-width="2" filter="url(#softGlow)">
    <path d="M122 152l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M403 155l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M390 348l9 23 23 9-23 9-9 23-9-23-23-9 23-9z"/>
    <path d="M255 57l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
  </g>

  <!-- floating Minecraft-like cubes -->
  <g fill="#28134f" stroke="#b88cff" stroke-width="3" opacity=".95">
    <path d="M115 306l26-12 26 12-26 13z"/><path d="M115 306v28l26 14v-29z"/><path d="M167 306v28l-26 14v-29z"/>
    <path d="M359 101l19-9 19 9-19 10z"/><path d="M359 101v20l19 10v-20z"/><path d="M397 101v20l-19 10v-20z"/>
    <path d="M356 374l24-11 24 11-24 12z"/><path d="M356 374v25l24 13v-26z"/><path d="M404 374v25l-24 13v-26z"/>
  </g>
</svg>