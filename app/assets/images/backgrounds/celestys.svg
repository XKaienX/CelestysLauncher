<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a3f86"/><stop offset=".36" stop-color="#247fcb"/><stop offset=".68" stop-color="#ff9d73"/><stop offset="1" stop-color="#ffd47c"/></linearGradient>
 <linearGradient id="island" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#55783c"/><stop offset=".08" stop-color="#354b2e"/><stop offset=".15" stop-color="#4b382c"/><stop offset="1" stop-color="#19141c"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffde1"/><stop offset=".25" stop-color="#ffd77b"/><stop offset="1" stop-color="#ff8a52" stop-opacity="0"/></radialGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
