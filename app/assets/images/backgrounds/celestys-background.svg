<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3f91"/>
      <stop offset=".48" stop-color="#2d78c4"/>
      <stop offset=".72" stop-color="#f5a75f"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="46%" r="18%">
      <stop stop-color="#fffbd5" stop-opacity="1"/>
      <stop offset=".18" stop-color="#ffd76a" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ff9f43" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#416d33"/>
      <stop offset=".18" stop-color="#315126"/>
      <stop offset=".2" stop-color="#5a4229"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
    <filter id="cloudBlur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="sunGlow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <circle cx="1400" cy="515" r="41" fill="#fffde1" filter="url(#sunGlow)"/>
  <circle cx="1400" cy="515" r="30" fill="#fff"/>

  <!-- clouds -->
  <g fill="#fff" opacity=".35" filter="url(#cloudBlur)">
    <ellipse cx="340" cy="760" rx="410" ry="110"/>
    <ellipse cx="980" cy="850" rx="500" ry="130"/>
    <ellipse cx="1610" cy="800" rx="390" ry="110"/>
  </g>

  <!-- distant islands -->
  <g fill="#243b37" opacity=".72">
    <path d="M1480 610h330l-55 130-218 36z"/>
    <path d="M1120 580h220l-35 97-160 35z"/>
  </g>

  <!-- left floating island -->
  <path d="M0 650L420 600l240 78-90 255-230 135H0z" fill="url(#island)"/>
  <path d="M0 625L390 575l230 72-15 55-610 35z" fill="#4c853a"/>

  <!-- stylized dragon statue -->
  <g transform="translate(95 250)" fill="#dce4ed" stroke="#9da9b7" stroke-width="9" stroke-linejoin="round">
    <path d="M78 300L170 172l88 38 91 118-62 26-91-59-52 88z"/>
    <path d="M167 176l-33-79 71-38 74 54-23 51-55-30z"/>
    <path d="M138 106l-57-40 75 2z"/>
    <path d="M210 70l34-69 28 81z"/>
    <path d="M263 312l65 75 43 94-45 12-76-104z"/>
    <path d="M123 318L58 385l-24 88 45 8 82-105z"/>
    <path d="M279 329l85-5 70 32-100 16z"/>
  </g>

  <!-- central island -->
  <path d="M520 620l760-82 250 143-118 320-720 54-225-252z" fill="url(#island)"/>
  <path d="M557 600l670-72 257 135-14 66-874 76z" fill="#437e35"/>

  <!-- trees -->
  <g>
    <g transform="translate(650 420)">
      <rect x="66" y="120" width="42" height="220" fill="#4b2d1a"/>
      <g fill="#2f7436"><rect x="0" y="70" width="180" height="80"/><rect x="30" y="20" width="140" height="90"/><rect x="55" y="0" width="90" height="80"/></g>
      <g fill="#4fa64b"><rect x="10" y="62" width="58" height="34"/><rect x="98" y="34" width="63" height="36"/></g>
    </g>
    <g transform="translate(1010 430) scale(.9)">
      <rect x="66" y="120" width="42" height="220" fill="#4b2d1a"/>
      <g fill="#2f7436"><rect x="0" y="70" width="180" height="80"/><rect x="30" y="20" width="140" height="90"/><rect x="55" y="0" width="90" height="80"/></g>
    </g>
  </g>

  <!-- central fantasy house -->
  <g transform="translate(865 420)">
    <rect x="0" y="190" width="280" height="245" fill="#5b341f" stroke="#2b190f" stroke-width="10"/>
    <rect x="52" y="245" width="70" height="90" fill="#ffa94d" opacity=".85"/>
    <rect x="174" y="245" width="60" height="90" fill="#ffa94d" opacity=".82"/>
    <path d="M-55 215L142 72l200 143-38 48-162-92-162 95z" fill="#4a137f" stroke="#2a0d47" stroke-width="12"/>
    <path d="M-16 198L142 91l163 110-25 23-138-79-134 79z" fill="#7c3aed"/>
    <rect x="118" y="5" width="48" height="110" fill="#5d351e"/>
  </g>

  <!-- purple roof foreground -->
  <g transform="translate(1185 600)">
    <path d="M-55 208L145 18l245 190-38 44-205-130-173 133z" fill="#401168" stroke="#29103c" stroke-width="12"/>
    <path d="M-12 196L145 55l196 147-31 30-163-101-137 105z" fill="#7c1cd4"/>
    <path d="M20 183L145 83l156 117-25 18-131-76-110 92z" fill="#a13cff"/>
    <rect x="35" y="211" width="240" height="190" fill="#593521"/>
  </g>

  <!-- CELESTYS sign -->
  <g transform="translate(760 635)">
    <rect x="-25" y="-25" width="375" height="92" rx="10" fill="#32105d" opacity=".82"/>
    <text x="160" y="38" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="70" letter-spacing="5" fill="#e9d5ff" stroke="#5b21b6" stroke-width="5" paint-order="stroke">CELESTYS</text>
  </g>

  <!-- purple crystal spires -->
  <g fill="#7c20cc" stroke="#b75cff" stroke-width="7">
    <path d="M1660 360l48-142 44 184-41 260-75 20z"/>
    <path d="M1790 585l35-104 37 139-25 184-56 11z"/>
  </g>

  <!-- foreground vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#080611" stroke-width="70" opacity=".22"/>
</svg>